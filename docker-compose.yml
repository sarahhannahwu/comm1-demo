services:
  aut-demo:
    build: .
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5000}
      ALLOW_REMOTE_PRESENTER: ${ALLOW_REMOTE_PRESENTER:-1}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your environment}
      OPENAI_TOKEN: ${OPENAI_TOKEN:?Set OPENAI_TOKEN in your environment}
      OPENAI_MODEL: ${OPENAI_MODEL:-text-embedding-3-small}
    volumes:
      - ./data:/app/data
    command: sh -c "python aut_live_demo.py --port 5000"